{% extends "base.html" %}
{% block title %}The Forge — The PAW{% endblock %}
{% block header_back %}<a class="back" href="{{ url_for('main.pitching') }}">← Pitching</a>{% endblock %}
{% block content %}
<style>
  main.wrap { max-width: 1200px; margin-top: 18px; }
  .forge [hidden] { display: none !important; }
  .forge { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 120px);
           min-height: 480px; background: #fff; border: 1px solid #e2e2e2;
           border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .forge-side { border-right: 1px solid #eee; display: flex; flex-direction: column; min-height: 0;
                background: #fafafa; }
  /* Same layering as the Velo Board banner: the spray-paint backdrop (alpha
     baked into the PNG) over the palm silhouettes over the page color, so the
     palms show through the paint. */
  .forge-side-head, .forge-head {
    background:
      url("{{ url_for('static', filename='reports/velo-backdrop.png') }}") var(--paint-pos, left center) / var(--paint-size, 640px) no-repeat,
      url("{{ url_for('static', filename='brand/palms-grey.png') }}") center 70% / 520px auto no-repeat,
      var(--bg);
    color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .35);
  }
  .forge-side-head { padding: 14px 14px 12px; --paint-pos: 18% 40%; }
  .forge-side-head h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; color: #fff;
                        font-size: 32px; line-height: 1; letter-spacing: .03em; }
  .forge-side-head h2 img { width: 34px; height: 34px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .forge-side-head input { padding: 8px 10px; font-size: 14px; border: none; }
  .forge-list { overflow-y: auto; flex: 1; padding: 6px 0 12px; }
  .forge-chan { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                width: 100%; padding: 8px 14px; background: none; border: none; cursor: pointer;
                font-size: 15px; color: #1a1a1a; text-align: left; }
  .forge-chan:hover { background: #f0f0f0; }
  .forge-chan.active { background: var(--crimson); color: #fff; }
  .forge-chan.unread .nm { font-weight: 700; }
  .forge-chan .you { font-size: 12px; opacity: .7; margin-left: 4px; }
  .forge-badge { background: var(--crimson); color: #fff; border-radius: 10px; font-size: 12px;
                 font-weight: 700; padding: 1px 7px; min-width: 20px; text-align: center; }
  .forge-chan.active .forge-badge { background: #fff; color: var(--crimson); }

  .forge-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .forge-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px;
                min-height: 62px; box-sizing: border-box;
                --paint-pos: right 30%; --paint-size: 1300px auto; }
  .forge-head h3 { margin: 0; font-size: 28px; line-height: 1; flex: 1; min-width: 0; color: #fff;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .forge-head select { width: auto; padding: 6px 8px; font-size: 14px; border: none; }
  .forge-back { display: none; background: none; border: none; font-size: 22px; cursor: pointer;
                color: #fff; padding: 0 6px 0 0; }
  .forge-day { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; color: #888;
               font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .forge-day::before, .forge-day::after { content: ""; flex: 1; height: 1px; background: #e2e2e2; }
  .forge-day:first-child { margin-top: 0; }
  .forge-feed { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .forge-empty { color: #888; text-align: center; margin-top: 60px; font-size: 15px; }

  .fp { display: flex; gap: 10px; padding: 8px 0; }
  .fp-av { flex: 0 0 34px; height: 34px; border-radius: 50%; background: #ddd; color: #fff;
           display: flex; align-items: center; justify-content: center; font-weight: 700;
           font-size: 14px; }
  .fp-av.coach { background: var(--blue); }
  .fp-av.player { background: var(--crimson); }
  .fp-body { flex: 1; min-width: 0; }
  .fp-meta { font-size: 13px; color: #888; }
  .fp-meta strong { color: #1a1a1a; font-size: 15px; margin-right: 6px; }
  .fp-meta .tag { background: #e8f3f8; color: var(--blue-dark); border-radius: 4px; font-size: 11px;
                  padding: 1px 5px; margin-right: 6px; font-weight: 600; }
  .fp-text { white-space: pre-wrap; word-wrap: break-word; font-size: 15px; margin-top: 2px; }
  .fp-text.deleted { color: #999; font-style: italic; }
  .fp-del { background: none; border: none; color: #bbb; cursor: pointer; font-size: 13px;
            margin-left: 8px; }
  .fp-del:hover { color: var(--crimson); }
  .ts { color: var(--blue); font-weight: 600; cursor: pointer; text-decoration: underline; }

  .fv { margin-top: 8px; max-width: 560px; }
  .fv video { width: 100%; max-height: 70vh; background: #000; border-radius: var(--radius); }
  .fv-status { background: #f4f4f4; border-radius: var(--radius); padding: 22px; color: #666;
               font-size: 14px; text-align: center; }
  .fv-status.failed { background: #fdecef; color: var(--crimson); }
  .fv-tools { display: flex; gap: 12px; margin-top: 6px; font-size: 13px; }
  .fv-tools button, .fc-reply { background: none; border: none; color: var(--blue); cursor: pointer;
                                font-size: 13px; padding: 0; font-weight: 600; }
  .fc { margin: 6px 0 0 4px; padding-left: 12px; border-left: 3px solid #eee; }
  .fc .fp { padding: 5px 0; }
  .fc .fp-av { flex-basis: 26px; height: 26px; font-size: 12px; }
  .fc-box { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
  .fc-box textarea { flex: 1; width: auto; min-width: 0; min-height: 44px; height: 44px;
                     font-size: 14px; padding: 10px; resize: vertical; border: 1px solid #ccc;
                     border-radius: var(--radius); font-family: inherit; }
  .fc-box .btn { padding: 10px 16px; }

  .forge-compose { border-top: 1px solid #eee; padding: 10px 14px; }
  .forge-compose-row { display: flex; gap: 8px; align-items: flex-end; }
  .forge-compose textarea { flex: 1; min-height: 44px; max-height: 160px; height: 44px;
                            resize: vertical; font-size: 15px; padding: 10px; border: 1px solid #ccc;
                            border-radius: var(--radius); font-family: inherit; }
  .forge-compose .btn { padding: 10px 16px; font-size: 17px; }
  .btn.blue { background: var(--blue); } .btn.blue:hover { background: var(--blue-dark); }
  .btn.ghost { background: #eee; color: #333; } .btn.ghost:hover { background: #ddd; }
  .forge-note { font-size: 12px; color: #888; margin-top: 6px; }

  .fu { border: 1px solid #e2e2e2; border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
        background: #fafafa; }
  .fu-name { font-weight: 600; font-size: 14px; word-break: break-all; }
  .fu textarea { width: 100%; margin: 8px 0; min-height: 50px; font-size: 14px; padding: 8px;
                 border: 1px solid #ccc; border-radius: var(--radius); font-family: inherit; }
  .fu-bar { height: 8px; background: #e6e6e6; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
  .fu-bar div { height: 100%; width: 0; background: var(--crimson); transition: width .3s; }
  .fu-msg { font-size: 13px; color: #666; }
  .fu-msg.err { color: var(--crimson); }
  .fu-actions { display: flex; gap: 8px; }

  @media (max-width: 720px) {
    main.wrap { margin: 0; padding: 0; }
    .forge { grid-template-columns: 1fr; height: calc(100vh - 64px); border: none; border-radius: 0;
             box-shadow: none; }
    .forge-main { display: none; }
    .forge.open .forge-side { display: none; }
    .forge.open .forge-main { display: flex; }
    .forge-back { display: inline; }
    .forge-feed { padding: 10px 12px; }
    .forge-compose .btn { padding: 10px 12px; }
  }
</style>

<div class="forge" id="forge">
  <aside class="forge-side">
    <div class="forge-side-head">
      <h2><img src="{{ url_for('static', filename='reports/lion-white.png') }}" alt="">The Forge</h2>
      <input type="text" id="forge-search" placeholder="Find a pitcher" autocomplete="off">
    </div>
    <nav class="forge-list" id="forge-list" aria-label="Channels"></nav>
  </aside>
  <section class="forge-main">
    <div class="forge-head">
      <button class="forge-back" id="forge-back" aria-label="Back to channels">←</button>
      <h3 id="forge-title">Pick a pitcher</h3>
      <select id="forge-season" aria-label="Season" hidden></select>
    </div>
    <div class="forge-feed" id="forge-feed">
      <p class="forge-empty">Choose a pitcher on the left to see their channel.</p>
    </div>
    <div class="forge-compose" id="forge-compose" hidden>
      <div id="forge-uploads"></div>
      <div class="forge-compose-row">
        <textarea id="forge-text" placeholder="Message" rows="1" maxlength="4000"></textarea>
        <button class="btn blue" id="forge-upload-btn" type="button" hidden>Video</button>
        <button class="btn" id="forge-send" type="button">Send</button>
      </div>
      <input type="file" id="forge-file" accept="video/*" hidden>
      <div class="forge-note" id="forge-note"></div>
    </div>
  </section>
</div>

<script id="forge-config" type="application/json">{{ forge_config | tojson }}</script>
<script src="{{ url_for('static', filename='forge/forge.js') }}"></script>
{% endblock %}
