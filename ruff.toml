line-length = 100
target-version = "py312"

# docs/ holds reference material only (e.g. a captured excerpt of an old
# Streamlit prototype kept for porting notes) -- it is never imported or run
# by the app, so it isn't worth linting.
extend-exclude = ["docs"]

[lint]
# Start with real bugs only: pyflakes (F) + a few bugbear checks.
# Style nits are deliberately excluded so a first-time contributor's PR is
# not buried in red.
select = ["F", "E9", "B"]
ignore = [
    "B008",
    # Pre-existing across app/ and tests/ (~30 call sites) predating this CI
    # task; enforcing strict= on every zip() would bloat this diff far beyond
    # its scope. Revisit as a follow-up cleanup, not part of security-hardening.
    "B905",
    # Pre-existing, handful of call sites in files this task didn't touch
    # (app/dashboards/bullpen/charts.py, tests/test_bullpen_dash.py). Fixing
    # them means editing files outside this task's scope.
    "F841",
    # Pre-existing f-strings with no placeholders in app/data/*_caps.py.
    # Cosmetic, not a bug; out of scope to touch those files here.
    "F541",
    # Pre-existing unused loop variables in app/dashboards/hitting/charts.py,
    # app/reports/plots.py, tests/test_hitting_caps.py. Out of scope.
    "B007",
    # Pre-existing loop-variable-in-closure pattern in app/data/velo_board.py.
    # Worth a follow-up look, but out of scope for this task -- see task-7
    # report for the concern flagged to the repo owner.
    "B023",
]

[lint.per-file-ignores]
"tests/*" = ["F811", "F401"]
