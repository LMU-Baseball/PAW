name: pipeline-cron

# GitHub Actions schedules are WORKFLOW-level, not job-level, so all three crons
# are declared here and each job gates itself on `github.event.schedule` below.
# If you add/change a cron string, update the matching job `if:` too, or that job
# silently stops running.
#
#   "30 9 * * *"  -> games + hittrax
#   "0 4 * * *"   -> bullpen (evening)
#   "0 16 * * *"  -> bullpen (morning)
#
# Cron here is UTC-only and does NOT observe daylight saving. The bullpen times are
# anchored to PST (UTC-8), so they drift an hour later in summer (PDT): 4:00 UTC is
# 8pm PST / 9pm PDT, and 16:00 UTC is 8am PST / 9am PDT. That direction is
# deliberate -- an evening run that drifted *earlier* could fire before practice
# ends and miss the session entirely, defeating the point of the 8pm slot.
on:
  schedule:
    - cron: "30 9 * * *"   # ~09:30 UTC daily -- after HitTrax's ~08:40 UTC export
    - cron: "0 4 * * *"    # bullpen evening -- 8pm PST / 9pm PDT
    - cron: "0 16 * * *"   # bullpen morning -- 8am PST / 9am PDT
  workflow_dispatch: {}     # manual "Run workflow" button, runs ALL jobs, for on-demand verification

permissions:
  contents: read

jobs:
  games:
    # Only the ~09:30 UTC slot (post-HitTrax-export); manual dispatch also runs it.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # LIVE as of 2026-08-28: a scoped dry-run (--since-days 21) confirmed the
      # SFTP walk + LMU filter work correctly (files=9, all correctly identified
      # as non_lmu, inserted=0 -- LMU's own fall games haven't started uploading
      # yet). Flipping now means the very first upload gets picked up
      # automatically on the next daily run, with nobody needing to remember to
      # come back and flip this later. A live run that inserts rows also
      # triggers precalc.rebuild_all() automatically (app/ingest/pipeline.py).
      - run: python -m flask --app run pipeline-load --no-dry-run --since-days 3
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          TM_SFTP_HOST: ${{ secrets.TM_SFTP_HOST }}
          TM_SFTP_USER: ${{ secrets.TM_SFTP_USER }}
          TM_SFTP_PASS: ${{ secrets.TM_SFTP_PASS }}
          PYTHONIOENCODING: utf-8

  bullpen:
    # Only the two bullpen slots (evening + morning); manual dispatch also runs it.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *' || github.event.schedule == '0 16 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # LIVE from day one — already run against prod once (2026-08) and
      # proved safe (insert-only, PlayID-deduped).
      - run: python -m flask --app run ingest bullpen --no-dry-run
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          TM_SFTP_HOST: ${{ secrets.TM_SFTP_HOST }}
          TM_SFTP_USER: ${{ secrets.TM_SFTP_USER }}
          TM_SFTP_PASS: ${{ secrets.TM_SFTP_PASS }}
          PYTHONIOENCODING: utf-8

  hittrax:
    # Only the ~09:30 UTC slot (post-HitTrax-export); manual dispatch also runs it.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # LIVE as of 2026-08-28: the selection bug that blocked this is fixed --
      # extract_load_raw now skips files already in RAW_PRACTICE_CSV and takes
      # what's left newest-first (see docs/PIPELINE_CRON.md), so a fixed
      # --limit 20 makes real progress every run instead of looping on the same
      # stale alphabetical prefix. --limit 20 itself is unchanged (already
      # proven to work over this FTPS connection via the prior dry-run jobs).
      - run: python -m flask --app run ingest hittrax --no-dry-run --limit 20
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          HT_FTPS_HOST: ${{ secrets.HT_FTPS_HOST }}
          HT_FTPS_USER: ${{ secrets.HT_FTPS_USER }}
          HT_FTPS_PASSWORD: ${{ secrets.HT_FTPS_PASSWORD }}
          HT_FTPS_REMOTE_DIR: ${{ secrets.HT_FTPS_REMOTE_DIR }}
          PYTHONIOENCODING: utf-8
