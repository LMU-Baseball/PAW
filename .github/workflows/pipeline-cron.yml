name: pipeline-cron

# GitHub Actions schedules are WORKFLOW-level, and every job below now runs on
# every fire of any of these three crons -- games/hittrax/bullpen all refresh
# together instead of games+hittrax being pinned to one daily slot. Redundant
# runs are harmless: every loader is insert-only and dedupes on its own key
# (PitchUID/PlayID), so a run that finds nothing new just costs a minute of
# free Actions time on this public repo.
#
# Times are UTC-only and do NOT observe daylight saving, and are deliberately
# off the exact hour -- GitHub's own docs warn the `schedule` trigger can be
# delayed "during periods of high loads... high load times include the start
# of every hour," and recommend a different minute to reduce it. The old
# on-the-hour bullpen crons (`0 4`/`0 16`) were visibly drifting hours late in
# practice; the `30 9` games/hittrax slot, already off the hour, was landing
# within minutes of on-time.
#
#   "7 4 * * *"    -> ~9:07pm Pacific (evening pass 1)
#   "17 6 * * *"   -> ~11:17pm Pacific (evening pass 2 -- same-night backstop
#                     so a delayed pass 1 doesn't leave coaches with nothing
#                     to check that night)
#   "13 16 * * *"  -> ~9:13am Pacific (morning pass -- catches anything both
#                     evening passes missed)
#
# PST vs PDT: these are fixed UTC times, so the Pacific-clock equivalent
# drifts an hour earlier once daylight saving ends in November (e.g. pass 1
# becomes ~8:07pm PST instead of ~9:07pm PDT).
on:
  schedule:
    - cron: "7 4 * * *"
    - cron: "17 6 * * *"
    - cron: "13 16 * * *"
  workflow_dispatch: {}     # manual "Run workflow" button, runs ALL jobs, for on-demand verification

permissions:
  contents: read

jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # LIVE as of 2026-08-28: a scoped dry-run (--since-days 21) confirmed the
      # SFTP walk + LMU filter work correctly (files=9, all correctly identified
      # as non_lmu, inserted=0 -- LMU's own fall games haven't started uploading
      # yet). Flipping now means the very first upload gets picked up
      # automatically on the next daily run, with nobody needing to remember to
      # come back and flip this later. A live run that inserts rows also
      # triggers precalc.rebuild_all() automatically (app/ingest/pipeline.py).
      - run: python -m flask --app run pipeline-load --no-dry-run --since-days 3
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          TM_SFTP_HOST: ${{ secrets.TM_SFTP_HOST }}
          TM_SFTP_USER: ${{ secrets.TM_SFTP_USER }}
          TM_SFTP_PASS: ${{ secrets.TM_SFTP_PASS }}
          PYTHONIOENCODING: utf-8

  bullpen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # LIVE from day one — already run against prod once (2026-08) and
      # proved safe (insert-only, PlayID-deduped).
      - run: python -m flask --app run ingest bullpen --no-dry-run
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          TM_SFTP_HOST: ${{ secrets.TM_SFTP_HOST }}
          TM_SFTP_USER: ${{ secrets.TM_SFTP_USER }}
          TM_SFTP_PASS: ${{ secrets.TM_SFTP_PASS }}
          PYTHONIOENCODING: utf-8

  bullpen-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Edgertronic per-pitch bullpen video, via the TrackMan Data API (not
      # SFTP -- see app.ingest.trackman_video/bullpen_video). Insert-only,
      # PlayID-deduped like every other loader here; bytes land straight in
      # bullpen_video_clips (a DB BLOB, see app.data.bullpen_video's module
      # docstring for why -- this job's runner has no persistent disk, same
      # as games/bullpen/hittrax above, so local-disk storage was never an
      # option). --days 3 overlaps the last couple of runs on purpose so a
      # late-arriving session (video is "post session," not instant) still
      # gets picked up; --limit keeps a first-real-run's download volume
      # bounded until clip sizes/timings over this connection are proven out
      # -- raise or drop it once that's confirmed.
      #
      # Each clip is remuxed from TrackMan's raw QuickTime .mov to MP4
      # before it's stored (app.ingest.bullpen_video.remux_to_mp4) --
      # confirmed live that Chrome's <video> hangs forever on the raw .mov
      # container even though the codec inside is already plain H.264, so
      # this needs `ffmpeg` on PATH. No extra install step below because
      # ubuntu-latest ships ffmpeg preinstalled.
      - run: python -m flask --app run ingest bullpen-video --no-dry-run --days 3 --limit 200
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          TM_API_CLIENT_ID: ${{ secrets.TM_API_CLIENT_ID }}
          TM_API_CLIENT_SECRET: ${{ secrets.TM_API_CLIENT_SECRET }}
          PYTHONIOENCODING: utf-8

  hittrax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # LIVE as of 2026-08-28: the selection bug that blocked this is fixed --
      # extract_load_raw now skips files already in RAW_PRACTICE_CSV and takes
      # what's left newest-first (see docs/PIPELINE_CRON.md), so a fixed
      # --limit 20 makes real progress every run instead of looping on the same
      # stale alphabetical prefix. --limit 20 itself is unchanged (already
      # proven to work over this FTPS connection via the prior dry-run jobs).
      - run: python -m flask --app run ingest hittrax --no-dry-run --limit 20
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          HT_FTPS_HOST: ${{ secrets.HT_FTPS_HOST }}
          HT_FTPS_USER: ${{ secrets.HT_FTPS_USER }}
          HT_FTPS_PASSWORD: ${{ secrets.HT_FTPS_PASSWORD }}
          HT_FTPS_REMOTE_DIR: ${{ secrets.HT_FTPS_REMOTE_DIR }}
          PYTHONIOENCODING: utf-8
